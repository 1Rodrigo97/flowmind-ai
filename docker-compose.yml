services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmind}
      POSTGRES_DB: ${POSTGRES_DB:-flowmind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowmind}:${POSTGRES_PASSWORD:-flowmind}@db:5432/${POSTGRES_DB:-flowmind}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      AUTOMATION_TOKEN: ${FLOWMIND_AUTOMATION_TOKEN:-}
      AUTOMATION_INBOX_DIR: /data/automation/inbox
      AUTOMATION_PROCESSED_DIR: /data/automation/processed
      AUTOMATION_FAILED_DIR: /data/automation/failed
    ports:
      - "8000:8000"
    volumes:
      # The API owns file movement, so the automation folders are mounted here.
      - ./automation:/data/automation
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5180:5180"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:1.70.0
    ports:
      - "5678:5678"
    environment:
      N8N_PORT: 5678
      N8N_HOST: localhost
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      # Base URL n8n uses to reach the FlowMind API (inside the compose network).
      FLOWMIND_API_URL: http://backend:8000
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      - backend

volumes:
  pgdata:
  n8ndata:
